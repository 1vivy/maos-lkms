name: maos-lkms independent ACK LKM gates
on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      generation:
        required: true
        type: number
      kmi_src:
        required: true
        type: string
      aarch64_out:
        required: true
        type: string
      x86_64_out:
        required: true
        type: string
permissions:
  contents: read
jobs:
  modules:
    # Runner supplies real fully-built ACK outputs, including CRCs/System.map.
    runs-on: [self-hosted, linux, x64, egysk-kmi]
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap the pinned DDK clang
        run: sh scripts/bootstrap-ddk-clang.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-08
          components: rust-src
      - name: Build and admit exact independent LKMs
        env:
          BRANCH: ${{ inputs.branch }}
          GENERATION: ${{ inputs.generation }}
          KMI_SRC: ${{ inputs.kmi_src }}
          KMI_OUT: ${{ matrix.arch == 'aarch64' && inputs.aarch64_out || inputs.x86_64_out }}
          KMI_ARCH: ${{ matrix.arch }}
        run: sh scripts/build-lkms.sh "$BRANCH" "$GENERATION" "$KMI_ARCH" "$KMI_SRC" "$KMI_OUT"
      - uses: actions/upload-artifact@v7
        with:
          name: maos-lkms-${{ inputs.branch }}-${{ inputs.generation }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
