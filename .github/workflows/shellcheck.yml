name: LKM shell contracts
on:
  push:
    branches: [main, dev]
    paths: ['scripts/build-lkms.sh', 'scripts/bootstrap-ddk-clang.sh', 'kernel/dm-thin-pool/build.sh', '.github/workflows/shellcheck.yml']
  pull_request:
    branches: [main, dev]
    paths: ['scripts/build-lkms.sh', 'scripts/bootstrap-ddk-clang.sh', 'kernel/dm-thin-pool/build.sh', '.github/workflows/shellcheck.yml']
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check owned build entrypoints
        run: shellcheck scripts/build-lkms.sh scripts/bootstrap-ddk-clang.sh kernel/dm-thin-pool/build.sh
