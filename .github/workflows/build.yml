name: maos-lkms independent LKM build and admission
on:
  push:
    branches: [main, dev, ci]
    paths: ['.github/workflows/**', 'kernel/**', 'include/**', 'scripts/**', 'justfile']
  pull_request:
    branches: [main, dev]
    paths: ['.github/workflows/**', 'kernel/**', 'include/**', 'scripts/**', 'justfile']
  workflow_dispatch:
    inputs:
      lane:
        description: Caller-supplied exact ACK/GKI source+output, or the canonical digest-pinned DDK image
        required: true
        type: choice
        options: [ack, ddk]
      branch:
        description: Exact ACK branch (for example android16-6.12)
        required: true
        type: string
        default: android16-6.12
      generation:
        description: Exact KMI generation
        required: true
        type: number
        default: 6
      kmi_src:
        description: Absolute source path on the self-hosted runner (ack lane only)
        required: false
        type: string
      aarch64_out:
        description: Absolute complete arm64 output, real CRCs and System.map (ack lane only)
        required: false
        type: string
      x86_64_out:
        description: Absolute complete x86_64 output, real CRCs and System.map (ack lane only)
        required: false
        type: string
permissions:
  contents: read
jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Exercise ELF, exact identity and build-info contracts
        run: python3 -m unittest scripts.test_kmi_modules
  ddk-arm64:
    # The canonical lane: push/PR and workflow_dispatch both exercise the
    # digest-pinned DDK image with no caller-supplied inputs.
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'ddk'
    needs: host-contract
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      branch: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'android16-6.12' }}
      generation: ${{ github.event_name == 'workflow_dispatch' && inputs.generation || 6 }}
  ack:
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'ack'
    needs: host-contract
    uses: ./.github/workflows/build-lkm.yml
    with:
      branch: ${{ inputs.branch }}
      generation: ${{ inputs.generation }}
      kmi_src: ${{ inputs.kmi_src }}
      aarch64_out: ${{ inputs.aarch64_out }}
      x86_64_out: ${{ inputs.x86_64_out }}
