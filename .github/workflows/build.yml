name: maos-lkms independent LKM build and admission
on:
  push:
    branches: [main, dev, ci]
    paths: ['.github/workflows/**', 'kernel/**', 'include/**', 'scripts/**', 'justfile']
  pull_request:
    branches: [main, dev]
    paths: ['.github/workflows/**', 'kernel/**', 'include/**', 'scripts/**', 'justfile']
  workflow_dispatch:
    inputs:
      lane:
        description: Fully prepared ACK runner or DDK image
        required: true
        type: choice
        options: [ack, ddk]
      branch:
        description: Exact ACK branch (for example android16-6.12)
        required: true
        type: string
      generation:
        description: Exact KMI generation
        required: true
        type: number
      kmi_src:
        description: Absolute source path on selected runner/container
        required: true
        type: string
      aarch64_out:
        description: Absolute complete arm64 output (real CRCs and System.map)
        required: true
        type: string
      x86_64_out:
        description: Absolute complete x86_64 output (real CRCs and System.map)
        required: true
        type: string
      ddk_release:
        description: Exact DDK image release, required for DDK lane
        required: false
        type: string
permissions:
  contents: read
jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Exercise ELF, exact identity and build-info contracts
        run: python3 -m unittest scripts.test_kmi_modules
  ack:
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'ack'
    needs: host-contract
    uses: ./.github/workflows/build-lkm.yml
    with:
      branch: ${{ inputs.branch }}
      generation: ${{ inputs.generation }}
      kmi_src: ${{ inputs.kmi_src }}
      aarch64_out: ${{ inputs.aarch64_out }}
      x86_64_out: ${{ inputs.x86_64_out }}
  ddk:
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'ddk'
    needs: host-contract
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      branch: ${{ inputs.branch }}
      generation: ${{ inputs.generation }}
      kmi_src: ${{ inputs.kmi_src }}
      aarch64_out: ${{ inputs.aarch64_out }}
      x86_64_out: ${{ inputs.x86_64_out }}
      ddk_release: ${{ inputs.ddk_release }}
