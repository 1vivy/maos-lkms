name: maos-lkms canonical arm64 DDK lane
on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      generation:
        required: true
        type: number
permissions:
  contents: read
jobs:
  arm64:
    # No caller-supplied kernel source or output: the digest-pinned DDK image
    # is the build input, the way KernelSU's CI builds its GKI modules against
    # the same image family. A hosted runner with docker is sufficient.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-08
          components: rust-src
      - name: Build and admit the pinned arm64 target
        env:
          OUT_DIR: out/build-matrix
          BRANCH: ${{ inputs.branch }}
          GENERATION: ${{ inputs.generation }}
        run: sh scripts/build-ddk-lkms.sh "$BRANCH" "$GENERATION"
      - name: Package admitted maOS bootstrap module candidate
        env:
          OUT_DIR: out/build-matrix
          BRANCH: ${{ inputs.branch }}
          GENERATION: ${{ inputs.generation }}
          KMI_ARCH: aarch64
        run: >-
          python3 scripts/module_set.py package --release
          --directory "$OUT_DIR/modules/$BRANCH-$GENERATION/$KMI_ARCH"
          --out "$OUT_DIR/release/$BRANCH-$GENERATION/$KMI_ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: maos-lkms-candidate-${{ inputs.branch }}-${{ inputs.generation }}-aarch64
          path: out/build-matrix/release/${{ inputs.branch }}-${{ inputs.generation }}/
          if-no-files-found: error
