name: maos-lkms canonical arm64 DDK lane
on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      generation:
        required: true
        type: number
permissions:
  contents: read
jobs:
  arm64:
    # No caller-supplied kernel source or output: the digest-pinned DDK image
    # is the build input, the way KernelSU's CI builds its GKI modules against
    # the same image family. A hosted runner with docker is sufficient.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-08
          components: rust-src
      - name: Build and admit the canonical arm64 lane
        run: sh scripts/build-ddk-lkms.sh "${{ inputs.branch }}" "${{ inputs.generation }}"
      - uses: actions/upload-artifact@v7
        with:
          name: maos-lkms-ddk-${{ inputs.branch }}-${{ inputs.generation }}-aarch64
          path: out/
          if-no-files-found: error
