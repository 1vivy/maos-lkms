name: Egysk independent DDK LKM gates
on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      generation:
        required: true
        type: number
      kmi_src:
        required: true
        type: string
      aarch64_out:
        required: true
        type: string
      x86_64_out:
        required: true
        type: string
      ddk_release:
        required: true
        type: string
permissions:
  contents: read
jobs:
  modules:
    runs-on: [self-hosted, linux, x64, egysk-kmi]
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.branch }}-${{ inputs.ddk_release }}
      # The container sees only the runner workspace plus these binds. ddk-min
      # ships its own source and a modules_prepare-only kdir, so the
      # caller-supplied exact source and complete per-architecture outputs are
      # transferred by binding each absolute path at the identical container
      # path; nothing is copied or synthesized inside the container.
      volumes:
        - ${{ inputs.kmi_src }}:${{ inputs.kmi_src }}
        - ${{ inputs.aarch64_out }}:${{ inputs.aarch64_out }}
        - ${{ inputs.x86_64_out }}:${{ inputs.x86_64_out }}
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v7
      - name: Require complete exact output, not modules_prepare
        env:
          KMI_OUT: ${{ matrix.arch == 'aarch64' && inputs.aarch64_out || inputs.x86_64_out }}
        run: |
          for input in Module.symvers System.map include/generated/utsrelease.h .config; do
            test -s "$KMI_OUT/$input" || { echo "Missing real kernel input: $KMI_OUT/$input" >&2; exit 2; }
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-08
          components: rust-src
      - name: Build and admit exact independent LKMs
        env:
          BRANCH: ${{ inputs.branch }}
          GENERATION: ${{ inputs.generation }}
          KMI_SRC: ${{ inputs.kmi_src }}
          KMI_OUT: ${{ matrix.arch == 'aarch64' && inputs.aarch64_out || inputs.x86_64_out }}
          KMI_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          # ddk-min's arm64 prefix overrides ARCH-derived clang targets.
          unset CROSS_COMPILE
          sh scripts/build-lkms.sh "$BRANCH" "$GENERATION" "$KMI_ARCH" "$KMI_SRC" "$KMI_OUT" "$GITHUB_WORKSPACE/release"
      - uses: actions/upload-artifact@v7
        with:
          name: egysk-ddk-${{ inputs.branch }}-${{ inputs.generation }}-${{ matrix.arch }}-lkms
          path: release/
          if-no-files-found: error
